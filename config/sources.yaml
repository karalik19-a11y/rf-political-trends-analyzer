# Независимые / негосударственные публичные RSS (не госСМИ РФ)
# При блокировках часть лент может быть недоступна без VPN.

sources:
  - name: "Meduza"
    url: "https://meduza.io/rss/all"
    category: "politics"
    language: "ru"
    enabled: true

  - name: "Meduza EN"
    url: "https://meduza.io/rss/en/all"
    category: "politics"
    language: "en"
    enabled: true

  - name: "Mediazona"
    url: "https://zona.media/rss"
    category: "politics"
    language: "ru"
    enabled: true

  - name: "The Moscow Times"
    url: "https://www.themoscowtimes.com/rss/news"
    category: "politics"
    language: "en"
    enabled: true

  - name: "BBC Russian"
    url: "https://feeds.bbci.co.uk/russian/rss.xml"
    category: "politics"
    language: "ru"
    enabled: true

  - name: "DW Russian"
    url: "https://rss.dw.com/rdf/rss-ru-all"
    category: "politics"
    language: "ru"
    enabled: true

  - name: "Novaya Gazeta Europe"
    url: "https://novayagazeta.eu/feed/rss"
    category: "politics"
    language: "ru"
    enabled: true

  - name: "Radio Svoboda"
    url: "https://www.svoboda.org/api/z-pqpiev-qpp"
    category: "politics"
    language: "ru"
    enabled: true

settings:
  request_timeout: 20
  user_agent: "RF-Political-Trends-Analyzer/1.3 (research; independent sources; +https://github.com/karalik19-a11y/rf-political-trends-analyzer)"
  max_items_per_source: 40
  delay_between_requests: 2.0
  # Sentiment off by default for faster first run / less RAM
  enable_sentiment: false
  sentiment_model: "cointegrated/rubert-tiny-sentiment-balanced"
